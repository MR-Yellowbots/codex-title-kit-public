name: 跨平台验证
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            python: '3.10'
          - os: windows-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
          - os: ubuntu-latest
            python: '3.13'
    env:
      PYTHONUTF8: '0'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: 程序与真实进程锁测试
        run: python -m unittest discover -s tests -v
      - name: 安装官方 Codex CLI
        if: runner.os == 'Windows' && matrix.python == '3.13'
        run: npm install -g @openai/codex
      - name: Windows 原生 CLI 连接检查（不调用模型）
        if: runner.os == 'Windows' && matrix.python == '3.13'
        run: python scripts/codex_title_kit.py doctor

      - name: Windows 更新入口检查
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $tokens = $null
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path scripts/install-update-task.ps1).Path, [ref]$tokens, [ref]$errors)
          if ($errors.Count) { throw ($errors | Out-String) }
          python -c "import sys; sys.path.insert(0, 'scripts'); import update; assert update.idle_seconds() >= 0"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
